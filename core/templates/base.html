<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6A795D">
    <title>{% block title %}Faqja kryesore{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --olive: #6A795D;
            --olive-dark: #465440;
            --cream: #D9D28B;
            --paper: #f7f6ef;
            --ink: #292e27;
            --muted: #70766b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .site-nav {
            position: sticky;
            z-index: 10;
            top: 0;
            background: #6A795D;
            box-shadow: 0 4px 18px rgb(41 46 39 / 12%);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .site-nav-inner {
            display: flex;
            width: min(1120px, calc(100% - 40px));
            min-height: 68px;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            margin: 0 auto;
        }

        .site-brand {
            flex: 0 0 auto;
            color: #D9D28B;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-decoration: none;
        }

        .site-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        .site-links a {
            padding: 9px 12px;
            border-radius: 999px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 160ms ease, color 160ms ease;
        }

        .site-links a:hover,
        .site-links a:focus-visible {
            background: #D9D28B;
            color: #465440;
            outline: none;
        }

        .page {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
            padding: 72px 0 88px;
        }

        .intro {
            position: relative;
            overflow: hidden;
            margin-bottom: 36px;
            padding: clamp(30px, 6vw, 58px);
            border-radius: 24px;
            background: var(--olive);
            color: white;
        }

        .intro::after {
            position: absolute;
            top: -100px;
            right: -50px;
            width: 280px;
            height: 280px;
            border: 1px solid rgb(255 255 255 / 18%);
            border-radius: 50%;
            box-shadow: 0 0 0 32px rgb(255 255 255 / 5%), 0 0 0 64px rgb(255 255 255 / 4%);
            content: "";
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 14px;
            color: var(--cream);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .page h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.4rem, 6vw, 4rem);
            font-weight: 500;
            letter-spacing: -0.04em;
            line-height: 1.05;
        }

        .intro-copy {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 16px 0 0;
            color: rgb(255 255 255 / 82%);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 0 2px 18px;
        }

        .section-heading h2 {
            margin: 0;
            color: var(--olive-dark);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .client-count {
            padding: 7px 12px;
            border: 1px solid rgb(106 121 93 / 20%);
            border-radius: 999px;
            background: white;
            color: var(--olive-dark);
            font-size: 0.83rem;
            font-weight: 600;
        }

        .client-grid,
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
            gap: 18px;
        }

        .client-card,
        .feature-card {
            min-width: 0;
            padding: 24px;
            border: 1px solid rgb(106 121 93 / 14%);
            border-radius: 18px;
            background: white;
            box-shadow: 0 8px 24px rgb(41 46 39 / 5%);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .client-card:hover,
        .feature-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgb(41 46 39 / 10%);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 21px;
        }

        .client-mark {
            display: grid;
            flex: 0 0 48px;
            width: 48px;
            height: 48px;
            place-items: center;
            border-radius: 15px;
            background: var(--cream);
            color: var(--olive-dark);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .client-card h3,
        .feature-card h3 {
            overflow-wrap: anywhere;
            margin: 0;
            color: var(--olive-dark);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .client-details {
            display: grid;
            gap: 14px;
            margin: 0;
        }

        .detail {
            display: grid;
            grid-template-columns: 74px minmax(0, 1fr);
            gap: 8px;
            margin: 0;
            font-size: 0.92rem;
            line-height: 1.5;
        }

        .detail dt {
            color: var(--muted);
        }

        .detail dd {
            overflow-wrap: anywhere;
            margin: 0;
            color: var(--ink);
        }

        .empty-state {
            padding: 38px 24px;
            border: 1px dashed rgb(106 121 93 / 35%);
            border-radius: 18px;
            color: var(--muted);
            text-align: center;
        }

        .feature-card p {
            margin: 12px 0 0;
            color: var(--muted);
            line-height: 1.65;
        }

        .feature-card a {
            color: var(--olive-dark);
            font-weight: 600;
            text-decoration-color: rgb(106 121 93 / 45%);
            text-underline-offset: 3px;
        }

        .feature-card a:hover {
            text-decoration-color: currentColor;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 760px) {
            .site-nav-inner {
                min-height: 0;
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
                padding: 14px 0;
            }

            .site-links {
                justify-content: flex-start;
                gap: 2px;
            }

            .site-links a {
                padding: 8px 10px;
                font-size: 0.84rem;
            }
        }

        @media (max-width: 480px) {
            .site-nav-inner,
            .page {
                width: calc(100% - 28px);
                padding: 28px 0 48px;
            }

            .intro {
                margin-bottom: 28px;
                border-radius: 20px;
            }

            .client-card,
            .feature-card {
                padding: 21px;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="site-nav" aria-label="Navigimi kryesor">
        <div class="site-nav-inner">
            <a class="site-brand" href="{% url 'homepage' %}">Django Test</a>
            <div class="site-links">
                <a href="{% url 'homepage' %}">Kryefaqja</a>
                <a href="{% url 'about' %}">Rreth nesh</a>
                <a href="{% url 'all_products' %}">Produktet</a>
                <a href="{% url 'vendors' %}">Furnitorët</a>
                <a href="{% url 'clients' %}">Klientët</a>
                <a href="{% url 'contact' %}">Kontakt</a>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
